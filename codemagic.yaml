# Codemagic: byg mobilappen fra dette repo.
# Appen peger på https://klub.rpix.dk (KLUB_API). Til test mod testserveren: sæt KLUB_API=https://test.klub.rpix.dk.
# Første gang: forbind repoet i Codemagic og opret en App Store Connect API-nøgle (Teams → Integrations) med navnet i
# integrations.app_store_connect nedenfor. Android-testudgaven kræver ingen signering (debug-APK).

workflows:
  android-test:
    name: Android – testudgave (APK)
    max_build_duration: 30
    instance_type: mac_mini_m2   # gratisplanen har kun macOS-maskiner (Android bygger fint her)
    environment:
      node: 22
      java: 21
      vars:
        KLUB_API: https://klub.rpix.dk
    scripts:
      - name: Installer afhængigheder
        script: npm ci
      - name: Byg app-udgaven af webappen
        script: npm run build:app
      - name: Kopiér til Android-projektet
        script: npx cap sync android
      - name: Byg APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-test:
    name: iOS – testudgave (TestFlight)
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Klubsystem   # navnet på API-nøglen i Codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dk.surfhorsens.klub
      vars:
        KLUB_API: https://klub.rpix.dk
    scripts:
      - name: Installer afhængigheder
        script: npm ci
      - name: Byg app-udgaven af webappen
        script: npm run build:app
      - name: Kopiér til iOS-projektet
        script: npx cap sync ios
      - name: Signering
        script: xcode-project use-profiles
      - name: Byggenummer
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Byg IPA
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-adhoc:
    name: iOS – Ad Hoc (Diawi)
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Klubsystem
    environment:
      node: 22
      xcode: latest
      groups:
        - diawi                     # indeholder DIAWI_TOKEN (hemmelig)
      ios_signing:
        distribution_type: ad_hoc   # profilen indeholder de enheder, der er registreret hos Apple
        bundle_identifier: dk.surfhorsens.klub
      vars:
        KLUB_API: https://klub.rpix.dk
    scripts:
      - name: Installer afhængigheder
        script: npm ci
      - name: Byg app-udgaven af webappen
        script: npm run build:app
      - name: Kopiér til iOS-projektet
        script: npx cap sync ios
      - name: Signering
        script: xcode-project use-profiles
      - name: Byggenummer
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Byg IPA
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
      - name: Upload til Diawi
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          JOB=$(curl -s https://upload.diawi.com/ -F token="$DIAWI_TOKEN" -F file=@"$IPA" -F find_by_udid=0 -F wall_of_apps=0 | python3 -c 'import sys,json; print(json.load(sys.stdin)["job"])')
          for i in $(seq 1 30); do
            sleep 5
            R=$(curl -s "https://upload.diawi.com/status?token=$DIAWI_TOKEN&job=$JOB")
            STATUS=$(echo "$R" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            if [ "$STATUS" = "2000" ]; then
              echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("\nInstallér appen her: " + d["link"] + "\n")'
              exit 0
            fi
            [ "$STATUS" = "4000" ] && { echo "$R"; exit 1; }
          done
          echo "Diawi blev ikke færdig i tide: $R"; exit 1
    artifacts:
      - build/ios/ipa/*.ipa
